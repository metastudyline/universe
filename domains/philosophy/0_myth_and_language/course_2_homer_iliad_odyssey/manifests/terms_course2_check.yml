course_id: "course_2"
course_title: "课程二《愤怒、荣誉与命运》"
milestone_asset: "terms_checklist_25"
description: "课程二 25 专名与核心概念结课认读考核表（认读要求：见字能拼、知晓重音、说出在《伊利亚特》或《奥德赛》中的发生学位置与哲学张力）"

terms:
  - greek: "μῆνις"
    translit: "mēnis"
    ipa: "/mɛ̂ː.nis/"
    context: "《伊利亚特》全诗第一个词，阿基琉斯具有神圣破坏性的愤怒"
  - greek: "τιμή"
    translit: "timē"
    ipa: "/tiː.mɛ̌ː/"
    context: "荣誉、社会份额、公共评估，荷马贵族耻感文化的核心"
  - greek: "γέρας"
    translit: "geras"
    ipa: "/ɡé.ras/"
    context: "特权战利品，荣誉 timē 在现实中的唯一物化确证"
  - greek: "μοῖρα"
    translit: "moira"
    ipa: "/môi̯.ra/"
    context: "配额与命运，源自动词 meiresthai（分配份额）"
  - greek: "κλέος ἄφθιτον"
    translit: "kleos aphthiton"
    ipa: "/klé.os ápʰ.tʰi.ton/"
    context: "不朽的声名，印欧诗学古老母题，英雄换取永恒的代价"
  - greek: "Ἀχιλλεύς"
    translit: "Achilleus"
    ipa: "/a.kʰil.lěu̯s/"
    context: "阿基琉斯，密尔弥冬人之王，反思英雄价值体系的悲剧主角"
  - greek: "Ἀγαμέμνων"
    translit: "Agamemnon"
    ipa: "/a.ɡa.mém.nɔːn/"
    context: "阿伽门农，阿耳戈斯统帅，强权僭越分配契约的君主"
  - greek: "Ἕκτωρ"
    translit: "Hektor"
    ipa: "/hék.tɔːr/"
    context: "赫克托耳，特洛伊护城砥柱，为保卫城邦战死的责任型英雄"
  - greek: "Πρίαμος"
    translit: "Priamos"
    ipa: "/prí.a.mos/"
    context: "普里阿摩斯，特洛伊老王，深夜赴敌营亲吻仇人之手赎尸"
  - greek: "Πατροκλέης"
    translit: "Patroklees"
    ipa: "/pa.tro.klé.ɛːs/"
    context: "帕特洛克罗斯，阿基琉斯的至交同袍，其死触发阿基琉斯回归"
  - greek: "ἀρετή"
    translit: "aretē"
    ipa: "/a.re.tɛ̌ː/"
    context: "卓越、德性，在战场杀敌与广场言说中展现的最高能力"
  - greek: "ψυχή"
    translit: "psyche"
    ipa: "/psyː.kʰɛ̌ː/"
    context: "活命之息/死后游魂，跨过牙齿藩篱永不复返的生命"
  - greek: "εἴδωλον"
    translit: "eidolon"
    ipa: "/ěː.dɔː.lon/"
    context: "无意识的虚弱游魂/暗影，冥界中需饮血才能说话的存在"
  - greek: "θυμός"
    translit: "thumos"
    ipa: "/tʰyː.mós/"
    context: "胸腔中的生命激情与意志，肉体活动的动力因"
  - greek: "φρήν / φρένες"
    translit: "phren / phrenes"
    ipa: "/pʰrɛ̌ːn / pʰré.nes/"
    context: "横膈膜中焦，荷马人体解剖中心智与理解力的具身驻地"
  - greek: "ποινή"
    translit: "poinē"
    ipa: "/poi̯.nɛ̌ː/"
    context: "杀人赔偿金/血金，卷十八阿基琉斯之盾法庭审判的焦点"
  - greek: "ἵστωρ"
    translit: "istōr"
    ipa: "/hís.tɔːr/"
    context: "知情仲裁者/法官，历史学家（historia）概念的原初词源"
  - greek: "ἀγορή"
    translit: "agorē"
    ipa: "/a.ɡo.rɛ̌ː/"
    context: "军中集会与城邦广场，言说、诉讼与分配正义的公共空间"
  - greek: "νόστος"
    translit: "nostos"
    ipa: "/nós.tos/"
    context: "还乡，《奥德赛》的核心母题（怀旧 nostalgia 的词源）"
  - greek: "ἔλεος"
    translit: "eleos"
    ipa: "/é.le.os/"
    context: "怜悯与同情，基于人类共同必死性的伦理跨越"
