course_id: "course_3"
course_title: "课程三《城邦的裂缝》"
milestone_asset: "terms_checklist_30"
description: "课程三 30 专名与核心哲学概念结课认读考核表（认读要求：见字能拼、知晓重音、说出在古希腊悲剧中的发生学位置与制度法哲学张力）"

terms:
  - greek: "τραγῳδία"
    translit: "tragōidia"
    ipa: "/tra.ɡɔːi̯.dí.aː/"
    context: "悲剧（山羊之歌），雅典城邦大狄奥尼索斯节的公共思考装置"
  - greek: "πόλις"
    translit: "polis"
    ipa: "/pó.lis/"
    context: "城邦，公民共同体，政治、司法与戏剧生活的终极场域"
  - greek: "νόμος"
    translit: "nomos"
    ipa: "/nó.mos/"
    context: "法律、成文法令、约定，与自然 physis 构成古希腊核心张力"
  - greek: "ἄγραπτα νόμιμα"
    translit: "agrapta nomima"
    ipa: "/á.ɡrap.ta nó.mi.ma/"
    context: "不成文神圣法则，安提戈涅诉诸的超越城邦令状的永恒神法"
  - greek: "Ἐρινύες"
    translit: "Erinyes"
    ipa: "/e.ri.ný.es/"
    context: "复仇女神，代表前城邦母系血亲同质禁忌的古老地底神祇"
  - greek: "Εὐμενίδες"
    translit: "Eumenides"
    ipa: "/eu̯.me.ní.des/"
    context: "慈惠女神，复仇女神被雅典娜政治收编后的尊荣身份"
  - greek: "Ἄρειος Πάγος"
    translit: "Areios Pagos"
    ipa: "/á.reː.os pá.ɡos/"
    context: "战神山法庭，雅典审判蓄意谋杀案的神圣刑事法庭"
  - greek: "Ὀρέστης"
    translit: "Orestes"
    ipa: "/o.rés.tɛːs/"
    context: "奥瑞斯忒斯，弑母复仇者，战神山法庭平票被判无罪的主角"
  - greek: "Ἀντιγόνη"
    translit: "Antigone"
    ipa: "/an.ti.ɡó.nɛː/"
    context: "安提戈涅，俄狄浦斯之女，为埋葬兄长违抗国王法令的悲剧主角"
  - greek: "Κρέων"
    translit: "Kreōn"
    ipa: "/kré.ɔːn/"
    context: "克瑞翁，忒拜统治者，极端推行城邦国家实在法与专制命令的执政官"
  - greek: "Οἰδίπους"
    translit: "Oidipous"
    ipa: "/oi̯.dí.puːs/"
    context: "俄狄浦斯（肿脚者），解开斯芬克斯之谜却陷入知与不知悲剧的王者"
  - greek: "Μήδεια"
    translit: "Mēdeia"
    ipa: "/mɛ̌ː.deː.a/"
    context: "美狄亚，科尔喀斯异邦巫女，理性算计与极度复仇激情的悲剧代表"
  - greek: "Σωκράτης"
    translit: "Sōkratēs"
    ipa: "/sɔː.krá.tɛːs/"
    context: "苏格拉底，在阿里斯托芬喜剧《云》中被反讽讽刺的自然哲学家与智者"
  - greek: "κάθαρσις"
    translit: "katharsis"
    ipa: "/ká.tʰar.sis/"
    context: "净化/陶冶，亚里士多德《诗学》中悲剧引发怜悯与恐惧后的情感净化"
  - greek: "ἁμαρτία"
    translit: "hamartia"
    ipa: "/ha.mar.tí.aː/"
    context: "悲剧过失/未中靶心，英雄因认知局限而非道德败坏导致的悲剧根源"
  - greek: "τὸ δεινόν"
    translit: "to deinon"
    ipa: "/to deː.nón/"
    context: "神圣的恐怖/敬畏，城邦法治不可或缺的内在威慑基石"
  - greek: "Πειθώ"
    translit: "Peithō"
    ipa: "/peː.tʰɔ̌ː/"
    context: "说服女神，雅典娜用来安抚并收编复仇女神的政治理性工具"
  - greek: "ἴσος ψῆφος"
    translit: "isos psephos"
    ipa: "/í.sos psɛ̂ː.pʰos/"
    context: "平票，战神山陪审团票数相等时触发雅典娜之票的法理状态"
  - greek: "μίασμα"
    translit: "miasma"
    ipa: "/mí.as.ma/"
    context: "不洁/宗教污染，未受安葬的尸体或弑亲罪孽对城邦降下的瘟疫诅咒"
  - greek: "στάσις"
    translit: "stasis"
    ipa: "/stá.sis/"
    context: "城邦内乱/派系血仇，古希腊政治哲学家最警惕的共同体解体危机"
