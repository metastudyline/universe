version: "1.0.0"
stage: "0_myth_and_language"
description: "古希腊哲学史 0 段约 60 词专名与关键词标准认读库 (认读级：见字能拼、能标重音、知晓字面义与发生学定位)"

categories:
  - id: "cosmogony"
    name_cn: "宇宙生成 (Cosmogony & Arche)"
    terms:
      - greek: "Χάος"
        translit: "Chaos"
        ipa: "/kʰá.os/"
        literal: "裂口、张开的深渊"
        cn: "卡俄斯、混沌"
        en: "chasm, void, abyss"
        note: "在《神谱》116行最初生成，不是混乱，而是裂开的空间"
      - greek: "Γαῖα"
        translit: "Gaia"
        ipa: "/ɡâi̯.a/"
        literal: "大地、坚实基底"
        cn: "盖亚、大地"
        en: "earth, broad-bosomed ground"
        note: "一切神祇与万物的稳固立足点"
      - greek: "Τάρταρος"
        translit: "Tartaros"
        ipa: "/tár.ta.ros/"
        literal: "阴暗深渊、地底边界"
        cn: "塔尔塔罗斯、地狱深渊"
        en: "misty abyss beneath Hades"
        note: "宇宙最底层的物理与神圣边界"
      - greek: "Ἔρος"
        translit: "Eros"
        ipa: "/é.ros/"
        literal: "爱欲、使肢体松弛的力量"
        cn: "厄洛斯、爱欲"
        en: "love, desire, cosmogenic drive"
        note: "生成与繁衍的动力因前身"
      - greek: "ἀρχή"
        translit: "archē"
        ipa: "/ar.kʰɛ̌ː/"
        literal: "开端、本原、支配统治"
        cn: "本原、始基"
        en: "beginning, origin, first principle, rule"
        note: "通向米利都学派自然哲学的核心概念"
      - greek: "φύσις"
        translit: "physis"
        ipa: "/pʰý.sis/"
        literal: "自然生长、万物本性"
        cn: "自然、本性"
        en: "nature, growth, inherent constitution"
        note: "动词 phyo（生长）派生词"
      - greek: "κόσμος"
        translit: "kosmos"
        ipa: "/kós.mos/"
        literal: "秩序、装饰、和谐整体"
        cn: "宇宙、秩序"
        en: "order, ornament, ordered universe"
        note: "毕达哥拉斯与赫拉克利特使用的核心宇宙词"

  - id: "justice_and_order"
    name_cn: "正义与秩序 (Justice, Order & Norms)"
    terms:
      - greek: "δίκη"
        translit: "dikē"
        ipa: "/dí.kɛː/"
        literal: "划界、判决、诉讼程序"
        cn: "正义、习俗法则"
        en: "justice, customary right, judgment"
        note: "赫西俄德对抗 hybris 的核心武器，阿那克西曼德'补偿其不义'的母本"
      - greek: "ὕβρις"
        translit: "hybris"
        ipa: "/hý.bris/"
        literal: "狂暴、越界、傲慢放肆"
        cn: "狂妄、傲慢、越界"
        en: "wanton violence, insolence, overweening pride"
        note: "破坏尺度（metron）招致毁灭的根本原因"
      - greek: "τιμή"
        translit: "timē"
        ipa: "/tiː.mɛ̌ː/"
        literal: "荣誉、社会份额、价值评估"
        cn: "荣誉、份额、赔偿"
        en: "honor, valuation, rightful share"
        note: "《伊利亚特》全书冲突的枢纽，公共分配正义的原型"
      - greek: "μοῖρα"
        translit: "moira"
        ipa: "/môi̯.ra/"
        literal: "分配到的份额、命中注定"
        cn: "命运、份额"
        en: "allotted portion, destiny, fate"
        note: "诸神与凡人都必须服从的宇宙定分"
      - greek: "νόμος"
        translit: "nomos"
        ipa: "/nó.mos/"
        literal: "习俗、成文法律、人定规约"
        cn: "法律、习俗、规约"
        en: "custom, convention, statutory law"
        note: "智者学派'自然(physis)对规约(nomos)'争论的前身"

  - id: "soul_and_mind"
    name_cn: "灵魂与心智 (Soul, Mind & Reason)"
    terms:
      - greek: "ψυχή"
        translit: "psychē"
        ipa: "/psyː.kʰɛ̌ː/"
        literal: "气息、死后游荡的幽灵、生命力"
        cn: "灵魂、心智"
        en: "breath of life, shade, soul"
        note: "荷马中仅指死后阴影，苏格拉底后成为道德与认识主体"
      - greek: "νοῦς"
        translit: "nous"
        ipa: "/nûːs/"
        literal: "智性洞见、心灵、理性直观"
        cn: "心灵、奴斯、理智"
        en: "mind, intuitive intellect, reason"
        note: "阿那克萨哥拉与亚里士多德第一推动者的概念源头"
      - greek: "λόγος"
        translit: "logos"
        ipa: "/ló.ɡos/"
        literal: "言说、比例、推论、解释、道"
        cn: "逻各斯、话语、理性、尺度"
        en: "word, reckoning, ratio, rational account"
        note: "西方理性主义的总源头"
      - greek: "ἀλήθεια"
        translit: "alētheia"
        ipa: "/a.lɛ̌ː.tʰeː.a/"
        literal: "非遮蔽、无遗忘、真理"
        cn: "真理、去蔽"
        en: "unconcealment, truth, reality"
        note: "a-(否定) + lēthē(遗忘/遮蔽)，海德格尔核心考据源"
