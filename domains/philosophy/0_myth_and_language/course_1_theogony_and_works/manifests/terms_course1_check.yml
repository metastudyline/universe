course_id: "course_1"
course_title: "课程一《世界从混沌里长出来》"
milestone_asset: "terms_checklist_30"
description: "课程一 30 专名与关键词结课认读考核表（认读要求：见字能拼、知晓重音、说出在《神谱》或《劳作与时日》中的发生学位置）"

terms:
  - greek: "Χάος"
    translit: "Chaos"
    ipa: "/kʰá.os/"
    context: "《神谱》116行最初涌现的开裂鸿沟"
  - greek: "Γαῖα"
    translit: "Gaia"
    ipa: "/ɡâi̯.a/"
    context: "宽胸的大地，万物的稳固基底"
  - greek: "Τάρταρος"
    translit: "Tartaros"
    ipa: "/tár.ta.ros/"
    context: "极渊深处，关押提坦神的地界"
  - greek: "Ἔρος"
    translit: "Eros"
    ipa: "/é.ros/"
    context: "使肢体松弛、支配神人理性的爱欲"
  - greek: "Οὐρανός"
    translit: "Ouranos"
    ipa: "/uː.ra.nós/"
    context: "星光闪耀的天空，第一代被阉割的统治者"
  - greek: "Κρόνος"
    translit: "Kronos"
    ipa: "/kró.nos/"
    context: "刚镰弑父的提坦之王，第二代吞噬子嗣者"
  - greek: "Ζεύς"
    translit: "Zeus"
    ipa: "/zděu̯s/"
    context: "雷霆霹雳之主，第三代分职建制者"
  - greek: "Τιτᾶνες"
    translit: "Titanes"
    ipa: "/tiː.tâː.nes/"
    context: "十二位古老神祇，提坦之战中被推翻"
  - greek: "Προμηθεύς"
    translit: "Prometheus"
    ipa: "/pro.mɛː.tʰěu̯s/"
    context: "先思者，墨科涅分肉欺骗宙斯并盗火"
  - greek: "Ἐπιμηθεύς"
    translit: "Epimetheus"
    ipa: "/e.pi.mɛː.tʰěu̯s/"
    context: "后思者，不顾警告接纳潘多拉"
  - greek: "Πανδώρα"
    translit: "Pandora"
    ipa: "/pan.dɔ̌ː.raː/"
    context: "众神馈赠的美丽灾厄，揭开瓮盖散播苦难"
  - greek: "Τυφωεύς"
    translit: "Typhoeus"
    ipa: "/tyː.pʰɔː.ěu̯s/"
    context: "盖亚与塔尔塔罗斯所生的百头巨怪，最后的混沌力量"
  - greek: "Μνημοσύνη"
    translit: "Mnemosyne"
    ipa: "/mnɛː.mo.sý.nɛː/"
    context: "记忆女神，与宙斯结合生下九位缪斯"
  - greek: "Μοῦσα"
    translit: "Mousa"
    ipa: "/mûː.sa/"
    context: "赫利孔山缪斯女神，向农人赫西俄德传授诗艺"
  - greek: "Ἔρις"
    translit: "Eris"
    ipa: "/é.ris/"
    context: "争斗之神，《劳作与时日》开篇区分为善恶二种"
  - greek: "δίκη"
    translit: "dike"
    ipa: "/dí.kɛː/"
    context: "划界与正义，宙斯赐予人类对抗禽兽的法则"
  - greek: "ὕβρις"
    translit: "hybris"
    ipa: "/hý.bris/"
    context: "狂暴越界，招致宙斯使者天谴的祸根"
  - greek: "βασιλεύς"
    translit: "basileus"
    ipa: "/ba.si.lěu̯s/"
    context: "阿斯克拉贵族长老，受贿做出弯曲判决者"
  - greek: "ἀρχή"
    translit: "arche"
    ipa: "/ar.kʰɛ̌ː/"
    context: "开端与本原，通向米利都自然哲学的关键接缝"
  - greek: "γένεσις"
    translit: "genesis"
    ipa: "/ɡé.ne.sis/"
    context: "生成与起源，与动词 gignesthai 同源"
