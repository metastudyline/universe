course_id: "stageA_course_1"
course_title: "阶段A 课程一《世界的质料与存在之锚》"
milestone_asset: "terms_checklist_30"
description: "阶段A 课程一 30 核心希腊哲学范畴考核表（认读要求：掌握精准发音、重音、DK残篇出处与哲学史演绎功能）"

terms:
  - greek: "ἀρχή"
    translit: "archē"
    ipa: "/ar.kʰɛ̌ː/"
    context: "本原、始基、统治开端，米利都学派追问宇宙第一物质的核心范畴"
  - greek: "φύσις"
    translit: "physis"
    ipa: "/pʰý.sis/"
    context: "自然、本性，源自动词 phyein（生长涌现），物理学 Physics 的词源"
  - greek: "ἄπειρον"
    translit: "apeiron"
    ipa: "/á.peː.ron/"
    context: "无定、无界、无限，阿那克西曼德 DK 12 B1 提出的非具象本原"
  - greek: "ἀριθμός"
    translit: "arithmos"
    ipa: "/a.ritʰ.mós/"
    context: "数，毕达哥拉斯学派视万物本质为数与几何比例"
  - greek: "τετρακτύς"
    translit: "tetraktys"
    ipa: "/te.trak.týs/"
    context: "四元体（1+2+3+4=10），毕达哥拉斯神圣誓言所指的宇宙全数"
  - greek: "ἄλογον"
    translit: "alogon"
    ipa: "/á.lo.ɡon/"
    context: "无理数/不可公度/不可言说，第一次数学危机的核心炸药"
  - greek: "κόσμος"
    translit: "cosmos"
    ipa: "/kóz.mos/"
    context: "宇宙、秩序、和谐，从装饰秩序演进为宇宙整体"
  - greek: "λόγος"
    translit: "logos"
    ipa: "/ló.ɡos/"
    context: "逻各斯、理路、言说、尺度，赫拉克利特永恒活火背后的客观法则"
  - greek: "πάντα ῥεῖ"
    translit: "panta rhei"
    ipa: "/pán.ta r̥eː/"
    context: "万物皆流，后世对赫拉克利特不断流动与生灭哲学的经典概括"
  - greek: "ἐναντιοδρομία"
    translit: "enantiodromia"
    ipa: "/e.nan.ti.o.dro.mí.aː/"
    context: "相反相成/物极必反，对立面在极端时向反面转化的辩证法则"
  - greek: "πόλεμος"
    translit: "polemos"
    ipa: "/pó.le.mos/"
    context: "战争、冲突，DK 22 B53 中被称为万物之父与万物之王"
  - greek: "τὸ ἐόν / τὸ ὄν"
    translit: "to eon / to on"
    ipa: "/to e.ón / to on/"
    context: "存在者 / 存在，巴门尼德本体论（Ontology）的唯一研究对象"
  - greek: "τὸ μὴ ἐόν"
    translit: "to me eon"
    ipa: "/to mɛː e.ón/"
    context: "非存在，巴门尼德宣布为不可思、不可言、绝不通行的虚无"
  - greek: "ἀλήθεια"
    translit: "alētheia"
    ipa: "/a.lɛ̌ː.tʰeː.a/"
    context: "真理（非遮蔽/去蔽），巴门尼德长诗中的真理之路"
  - greek: "δόξα"
    translit: "doxa"
    ipa: "/dók.sa/"
    context: "意见、表象，基于虚妄感官经验的生灭之说"
  - greek: "νοεῖν"
    translit: "noein"
    ipa: "/no.ěːn/"
    context: "思想、理知洞察，DK 28 B3 中与存在（einai）同一的理性活动"
  - greek: "ἀγένητον"
    translit: "agenēton"
    ipa: "/a.ɡé.nɛː.ton/"
    context: "不生的，巴门尼德证明存在绝不可能从非存在中生成的特征"
  - greek: "ἀνώλεθρον"
    translit: "anōlethron"
    ipa: "/a.nɔ̌ː.letʰ.ron/"
    context: "不灭的，巴门尼德证明存在永不毁损的特征"
  - greek: "ἀτρεμές"
    translit: "atremes"
    ipa: "/a.tre.més/"
    context: "不动的/静止的，爱利亚学派对存在的绝对静止断言"
  - greek: "οὖλον"
    translit: "oulon"
    ipa: "/ûː.lon/"
    context: "完整单一的/不可分割的，排除了虚空与多"
