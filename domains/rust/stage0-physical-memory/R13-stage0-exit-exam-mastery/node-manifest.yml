exit_criteria:
  quiz_questions:
    - id: "R13_Q1"
      type: "single_choice"
      prompt: "为什么 Rust 能在完全没有运行时垃圾回收器（No GC）的前提下，从数学上彻底保证 100% 内存安全？"
      options:
        - "通过在编译期应用基于仿射类型系统（Affine Types）的所有权与别名异或可变性（Aliasing XOR Mutability）静态证明"
        - "通过在操作系统底层植入隐蔽的守护进程"
        - "通过强制所有变量都使用堆分配"
        - "通过将所有 C 代码在运行期动态解释执行"
      correct_answer: "通过在编译期应用基于仿射类型系统（Affine Types）的所有权与别名异或可变性（Aliasing XOR Mutability）静态证明"
    - id: "R13_Q2"
      type: "single_choice"
      prompt: "下列关于栈分配与堆分配物理特性的陈述，完全正确的是？"
      options:
        - "栈分配仅需移动 RSP 寄存器且天然具备缓存连续性；堆分配需经由分配器寻址且存在碎片与多线程锁竞争代偿"
        - "栈分配比堆分配慢 100 倍"
        - "堆分配由 CPU 硬件指令直接单周期完成"
        - "栈内存只能存储全局静态常量"
      correct_answer: "栈分配仅需移动 RSP 寄存器且天然具备缓存连续性；堆分配需经由分配器寻址且存在碎片与多线程锁竞争代偿"
