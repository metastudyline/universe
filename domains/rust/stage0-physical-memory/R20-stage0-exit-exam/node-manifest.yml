exit_criteria:
  quiz_questions:
    - id: "R20_Q1"
      type: "single_choice"
      prompt: "为什么说堆分配在高并发场景下必然带来吞吐量惩罚？"
      options:
        - "因为堆内存强制要求显式加锁与空闲链表检索，并容易导致 CPU 缓存行未命中"
        - "因为操作系统内核会强制清空所有物理寄存器"
        - "因为栈指针 RSP 会发生死锁"
        - "因为编译期符号表会被擦除"
      correct_answer: "因为堆内存强制要求显式加锁与空闲链表检索，并容易导致 CPU 缓存行未命中"
    - id: "R20_Q2"
      type: "single_choice"
      prompt: "Rust 所有权模型建立在哪个数学类型系统基石之上？"
      options:
        - "仿射类型系统（Affine Type System，最多使用一次）"
        - "无限制类型系统（Unrestricted Type System）"
        - "纯一阶谓词逻辑系统"
        - "非确定性自动机"
      correct_answer: "仿射类型系统（Affine Type System，最多使用一次）"
