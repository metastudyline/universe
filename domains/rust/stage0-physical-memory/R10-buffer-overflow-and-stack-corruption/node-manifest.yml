      type: "single_choice"
      prompt: "在 x86_64 栈上向局部字符数组写入超出其长度的数据，最终会覆盖什么关键硬件数据导致控制流被劫持？"
      options:
        - "保存在栈帧底部的调用者函数返回地址（Saved RIP）"
        - "CPU 的 L1 缓存行基地址"
        - "操作系统的内核中断向量表"
        - "磁盘上的分区引导扇区"
      correct_answer: "保存在栈帧底部的调用者函数返回地址（Saved RIP）"
