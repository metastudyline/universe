schema_version: "1.0.0"
node_id: "R76"
title: "异步状态机与自引用物理钉住：Future、Pin 与 Unpin 类型系统证明"
domain: "rust"
stage: "阶段C·并发、异步与Unsafe"
estimated_minutes: 40
strict_prerequisites:
  - "R51"
soft_prerequisites: []
learning_objectives:
  - "掌握 async fn 脱糖为匿名有限状态机（Stackless Coroutine）的底层机制"
  - "剖析跨 await 借用生成自引用结构体时 memcpy 导致悬垂指针的物理灾难"
  - "论证 Pin<P<T>> 如何通过剥夺裸 &mut T 访问在类型系统层面保证地址恒定性（Address Invariant）"
exit_criteria:
  quiz_questions:
    - id: "R76_Q1"
      type: "single_choice"
      prompt: "为什么 Rust 中的自引用 Future 在跨 await 挂起期间绝对禁止被 Move（内存移动）？"
      options:
        - "因为自引用结构体内部字段保存了同结构体内其他字段的指针地址，一旦 memcpy 移动，该内部指针将指向旧栈地址沦为野指针"
        - "因为 Tokio 异步调度器不支持多线程"
        - "因为操作系统的网络 IO 必须绑定在主线程"
        - "因为 CPU 寄存器无法保存 64 位整数"
      correct_answer: "因为自引用结构体内部字段保存了同结构体内其他字段的指针地址，一旦 memcpy 移动，该内部指针将指向旧栈地址沦为野指针"
