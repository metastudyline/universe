title: "单态化与特质对象：零成本抽象与 dyn Trait 16 字节胖指针物理结构"
domain: "rust"
stage: "阶段B·特质系统与零成本抽象"
estimated_minutes: 35
strict_prerequisites:
  - "R50"
soft_prerequisites: []
learning_objectives:
  - "深入理解静态单态化（Monomorphization）在 LLVM 跨过程内联优化中的威力与代码膨胀权衡"
  - "剖析 dyn Trait 胖指针（8字节数据指针 + 8字节 vtable 指针）物理内存布局"
