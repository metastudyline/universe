exit_criteria:
  quiz_questions:
    - id: "R51_Q1"
      type: "single_choice"
      prompt: "在 64 位架构下，一个 `Box<dyn Trait>` 胖指针在内存中占用多少字节？"
      options:
        - "16 字节（8 字节实例数据指针 + 8 字节 .rodata 虚表指针）"
        - "8 字节（仅包含数据指针）"
        - "24 字节（包含引用计数）"
        - "32 字节（包含元数据头）"
      correct_answer: "16 字节（8 字节实例数据指针 + 8 字节 .rodata 虚表指针）"
