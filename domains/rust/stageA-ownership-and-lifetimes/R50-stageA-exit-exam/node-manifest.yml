schema_version: "1.0.0"
node_id: "R50"
title: "阶段A出段综合大考：所有权三大定律、借用检查器与生命周期形式化总闭环"
domain: "rust"
stage: "阶段A·所有权与生命周期"
estimated_minutes: 60
strict_prerequisites:
  - "R21"
  - "R22"
  - "R25"
  - "R28"
  - "R30"
  - "R35"
soft_prerequisites: []
learning_objectives:
  - "闭卷考核 Rust 所有权三大定律与底层破坏性 Move 汇编机制"
  - "考核别名异或可变性、LLVM noalias 优化与两阶段借用"
  - "考核 NLL 控制流图活性分析与 Polonius Datalog 借用集合求解"
  - "考核生命周期子类型化、型变（Variance）与 Invariant UAF 证明"
exit_criteria:
  quiz_questions:
    - id: "R50_Q1"
      type: "single_choice"
      prompt: "在没有实现 Copy 的情况下执行 `let y = x;`，Rust 编译器在 LLVM IR 层面最可能发生什么优化？"
      options:
        - "经过 SROA 标量替换优化后，直接在 CPU 寄存器间传递，运行期零内存拷贝与零额外开销"
        - "在堆上调用 malloc 分配等量内存并执行 memcpy"
        - "启动引用计数原子加 1"
        - "生成全局互斥锁进行同步"
      correct_answer: "经过 SROA 标量替换优化后，直接在 CPU 寄存器间传递，运行期零内存拷贝与零额外开销"
      explanation: "Rust 的 Move 是 Destructive Move，编译期静态剥夺原变量访问权，LLVM 能够激进消除不必要的内存装载。"
    - id: "R50_Q2"
      type: "single_choice"
      prompt: "当存在条件分支移动（Conditional Move）时，Rust 编译器如何判定作用域退出时是否需要调用 Drop？"
      options:
        - "在当前栈帧分配局部布尔标志（Stack Drop-Flag），在移动发生时置位，作用域退出时分支判定"
        - "在运行时抛出未捕获异常"
        - "强制禁止编写任何条件分支移动代码"
        - "全部交由操作系统在进程结束时回收"
      correct_answer: "在当前栈帧分配局部布尔标志（Stack Drop-Flag），在移动发生时置位，作用域退出时分支判定"
      explanation: "RFC 320 确立的栈帧 Drop-Flag 机制保证了条件移动下的精确单一析构。"
    - id: "R50_Q3"
      type: "single_choice"
      prompt: "为什么 Rust 能够自动为可变借用参数生成 LLVM `noalias` 元数据并激活激进的 SIMD 向量化？"
      options:
        - "因为「别名异或可变性」公理在编译期静态证明了 &mut T 指向的内存绝不会与任何其他活跃引用重叠"
        - "因为 Rust 禁用了所有系统中断"
        - "因为所有 Rust 数组都是固定 512 位长度"
        - "因为 Rust 没有指针概念"
      correct_answer: "因为「别名异或可变性」公理在编译期静态证明了 &mut T 指向的内存绝不会与任何其他活跃引用重叠"
      explanation: "没有指针别名（No Aliasing）是现代编译器执行循环重排与向量加载的最大性能前提。"
    - id: "R50_Q4"
      type: "single_choice"
      prompt: "两阶段借用（Two-Phase Borrows）在 `vec.push(vec.len())` 中起到了什么关键作用？"
      options:
        - "将 &mut vec 的借用分解为「预留态」与「激活态」，允许在参数 vec.len() 计算期间安全执行共享读"
        - "自动生成了 vec 的深拷贝副本"
        - "将 push 降级为只读操作"
        - "把表达式推迟到运行时求值"
      correct_answer: "将 &mut vec 的借用分解为「预留态」与「激活态」，允许在参数 vec.len() 计算期间安全执行共享读"
      explanation: "预留态不执行写入，从而使得方法链式调用符合人类直觉且保持内存绝对安全。"
    - id: "R50_Q5"
      type: "single_choice"
      prompt: "NLL (RFC 2094) 与传统词法生命周期（AST Lexical Lifetimes）的核心区别是？"
      options:
        - "NLL 基于控制流图（CFG）和变量活性分析（Liveness）界定生命周期点集，而非机械绑定在 AST 大括号"
        - "NLL 允许同时存在多个可变借用"
        - "NLL 取消了生命周期语法"
        - "NLL 只能在单线程下工作"
      correct_answer: "NLL 基于控制流图（CFG）和变量活性分析（Liveness）界定生命周期点集，而非机械绑定在 AST 大括号"
      explanation: "NLL 将生命周期映射为 CFG 上的真实活性区间，消除了大量虚假的借用冲突。"
    - id: "R50_Q6"
      type: "single_choice"
      prompt: "Polonius 借用检查器将生命周期（Origin）抽象为什么数学实体？"
      options:
        - "借用（Loans）的集合，并通过 Datalog 关系规则进行图可达性求解"
        - "时间戳整数"
        - "三维空间坐标"
        - "堆内存地址哈希表"
      correct_answer: "借用（Loans）的集合，并通过 Datalog 关系规则进行图可达性求解"
      explanation: "Polonius 将借用检查重构为 Datalog 集合包含与可达性推导，彻底攻克分支返回借用难题。"
    - id: "R50_Q7"
      type: "single_choice"
      prompt: "生命周期包含关系 `'long: 'short` 对应的子类型关系是什么？"
      options:
        - "'long <: 'short (活得久的生命周期是活得短的子类型)"
        - "'short <: 'long"
        - "'long == 'short"
        - "两者没有任何子类型关系"
      correct_answer: "'long <: 'short (活得久的生命周期是活得短的子类型)"
      explanation: "根据里氏替换原则，任何需要短生命周期的位置都可以安全传入长生命周期引用。"
    - id: "R50_Q8"
      type: "single_choice"
      prompt: "为什么 `&'a mut T` 对 `T` 必须强制为 Invariant（不变）？"
      options:
        - "防止通过子类型转换向长生命周期容器写入短生命周期引用，引发野指针与 UAF"
        - "为了限制程序员写出复杂代码"
        - "因为可变引用不支持泛型"
        - "为了加快链接器速度"
      correct_answer: "防止通过子类型转换向长生命周期容器写入短生命周期引用，引发野指针与 UAF"
      explanation: "可变引用具备写权限，若 T 协变，可构造出使静态全局指针指向已释放局部栈内存的 UAF 漏洞。"
    - id: "R50_Q9"
      type: "single_choice"
      prompt: "函数类型 `fn(T) -> U` 中参数 `T` 与返回值 `U` 的型变特征分别是？"
      options:
        - "T 逆变（Contravariant），U 协变（Covariant）"
        - "T 协变，U 逆变"
        - "T 和 U 都必须是不变"
        - "T 和 U 都必须是协变"
      correct_answer: "T 逆变（Contravariant），U 协变（Covariant）"
      explanation: "入参要求更宽松（逆变），返回值承诺更严格（协变），符合里氏替换原则。"
    - id: "R50_Q10"
      type: "single_choice"
      prompt: "在自定义只读 Raw Slice 智能指针时，应使用哪种 PhantomData 保证型变协变且不触发 DropCK 递归拥有检查？"
      options:
        - "PhantomData<*const T>"
        - "PhantomData<T>"
        - "PhantomData<fn(T) -> T>"
        - "PhantomData<&'static mut T>"
      correct_answer: "PhantomData<*const T>"
      explanation: "`PhantomData<*const T>` 对 T 协变且为 Non-owning，Drop 检查器不会判定其持有并释放 T。"
