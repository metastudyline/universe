schema_version: "1.0.0"
node_id: "R25"
title: "借用检查器与别名异或可变性：Polonius Datalog 模型与 LLVM noalias 优化"
domain: "rust"
stage: "阶段A·所有权与生命周期"
estimated_minutes: 35
strict_prerequisites:
  - "R21"
soft_prerequisites: []
learning_objectives:
  - "掌握「别名异或可变性（Aliasing XOR Mutability）」核心公理"
  - "理解 LLVM `noalias` 参数属性如何为 Rust 带来超越 C/C++ 的自动向量化与循环优化红利"
  - "理解数据竞争（Data Race）在类型系统层面的数学不可能定理"
exit_criteria:
  quiz_questions:
    - id: "R25_Q1"
      type: "single_choice"
      prompt: "Rust 借用检查器（Borrow Checker）的核心铁律是？"
      options:
        - "在同一作用域内，一个资源要么拥有任意多个不可变借用（&T），要么拥有唯一一个可变借用（&mut T），两者互斥（Aliasing XOR Mutability）"
        - "可以同时存在多个可变借用和不可变借用"
        - "借用不能跨越函数调用"
        - "借用必须手动调用 free 释放"
      correct_answer: "在同一作用域内，一个资源要么拥有任意多个不可变借用（&T），要么拥有唯一一个可变借用（&mut T），两者互斥（Aliasing XOR Mutability）"
      explanation: "共享即只读，独占即修改。这一铁律从数学上彻底消除了读写冲突、迭代器失效与多线程数据竞争。"
    - id: "R25_Q2"
      type: "single_choice"
      prompt: "为什么 Rust 函数签名为 `fn process(a: &mut [f32], b: &[f32])` 时，LLVM 能够生成比 C 语言更快的 SIMD 向量化汇编代码？"
      options:
        - "因为可变借用的排他性保证了 a 与 b 绝不会重叠（No Pointer Aliasing），LLVM 可以无顾虑地发射 `noalias` 元数据并进行激进的寄存器缓存与并行向量加载"
        - "因为 Rust 运行在虚拟机中"
        - "因为 f32 占用字节更少"
        - "因为 Rust 强制关闭了内存对齐"
      correct_answer: "因为可变借用的排他性保证了 a 与 b 绝不会重叠（No Pointer Aliasing），LLVM 可以无顾虑地发射 `noalias` 元数据并进行激进的寄存器缓存与并行向量加载"
      explanation: "在 C 语言中，指针别名（Pointer Aliasing）会导致编译器必须在每次写入后重新从内存加载；Rust 从语言级别根除了别名隐患。"
