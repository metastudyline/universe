name: Knowledge CI (Manual Dispatch)

# CI is set to manual dispatch per development preferences to avoid automatic noisy pipeline triggers.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable strict checking'
        required: false
        default: 'true'

jobs:
  validate-and-lint:
    name: Schema & Global DAG Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Knowledge Compiler Check
        working-directory: tools
        run: |
          cargo run --release -p studyline-compiler -- check \
            --schemas-dir ../schemas \
            --domains-dir ../domains \
            --strict
