name: StudyLine & NoteBoot Industrial 5-Stage CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 5-Stage Industrial Gatekeeper Runner
  # --------------------------------------------------------------------------
  gatekeeper:
    name: 5-Stage CI Gatekeeper (Lint, Schema, DAG, Tests, Performance Floor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute 5-Stage CI Gatekeeper Pipeline
        run: |
          chmod +x tools/ci-gatekeeper.sh tools/performance-floor-check.sh
          ./tools/ci-gatekeeper.sh
