[package]
name = "noteboot-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noteboot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
prettytable-rs = "0.10"
walkdir = "2.5"
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
